name: Tauri Cross-Platform Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:     # Allows you to click "Run workflow" in your browser

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            run-platform: linux
          - os: macos-latest
            run-platform: macos
          - os: windows-latest
            run-platform: windows

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Setup Node.js (Using v22 avoids the outdated v20/v24 warnings)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 2. Setup Rust toolchain
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # 3. Cache Rust dependencies to speed up future builds
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # 4. Linux requires extra system packages to build Tauri apps
      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # 5. Install frontend dependencies (npm, yarn, or pnpm)
      - name: Install Frontend Dependencies
        run: npm install

      # 6. Run the official Tauri build action
      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__ # Creates a draft release version
          releaseName: 'App v__VERSION__'
          releaseBody: 'See the attached assets for your operating system.'
          releaseDraft: true
          prerelease: false
