name: Cross-Platform Build Workflow

on:
  push:
    branches: [ "main" ] # Runs automatically every time you push to main
  workflow_dispatch:     # Adds a manual "Run" button in your browser

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    # ========================================================
    # PLACEHOLDER: Replace this section with your build step!
    # ========================================================
    - name: Compile Code
      shell: bash
      run: |
        echo "Building code on ${{ matrix.os }}..."
        mkdir -p output
        echo "This is a placeholder for your compiled app" > output/app-compiled-file
    # ========================================================

    - name: Save the Finished Executable
      uses: actions/upload-artifact@v4
      with:
        name: build-output-${{ matrix.os }}
        path: output/ # Saves everything inside the output folder
