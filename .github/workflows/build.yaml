name: Tauri Cross-Platform Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:     # Allows you to click "Run workflow" in your browser

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false   # IMPORTANT: Stops a Linux error from killing Windows/Mac
      matrix:
        include:
          - os: macos-latest
            run-platform: macos
          - os: windows-latest
            run-platform: windows
          - os: ubuntu-24.04
            run-platform: linux

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm libxdo-dev libx11-dev libxrandr-dev libxcb1-dev libdbus-1-dev libclang-dev libpipewire-0.3-dev libwayland-dev libegl1-mesa-dev libgbm-dev

      # 1. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 2. Setup Rust toolchain
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # 3. Cache Rust dependencies
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # 4. Install frontend dependencies
      - name: Install Frontend Dependencies
        run: npm ci

      - name: Check frontend
        run: npm run check

      - name: Check Rust
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      # 5. Run the official Tauri build action
      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: 'App v__VERSION__'
          releaseBody: 'See the attached assets for your operating system.'
          releaseDraft: true
          prerelease: false
