name: Tauri Cross-Platform Build

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            run-platform: macos
          - os: windows-latest
            run-platform: windows
          - os: ubuntu-24.04
            run-platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm libxdo-dev

      # 1. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. Setup Rust toolchain
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # 4. Cache Rust dependencies
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # 5. Install frontend dependencies
      - name: Install Frontend Dependencies
        run: npm ci

      - name: Check frontend
        run: npm run check

      - name: Check Rust
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      # 6. Build Tauri application
      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: "App v__VERSION__"
          releaseBody: "See the attached assets for your operating system."
          releaseDraft: true
          prerelease: false

      # 7. Upload Windows installers
      - name: Upload Windows Installers
        if: matrix.run-platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ProColorator-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30

      # 8. Upload macOS installers
      - name: Upload macOS Installers
        if: matrix.run-platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: ProColorator-macOS
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app/**
          if-no-files-found: error
          retention-days: 30
