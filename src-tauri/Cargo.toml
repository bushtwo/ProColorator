[package]
name = "procolorator"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "procolorator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
xcap = "0.9"
tauri-plugin-global-shortcut = "2"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
#xcap = "0.9.8"
image = { version = "0.25", default-features = false, features = ["png"] }
device_query = "4"
tauri-plugin-clipboard-manager = "2"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
rdev = { version = "0.5", features = ["unstable_grab"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["tokio", "screenshot"] }
x11 = { version = "2", features = ["xlib"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
